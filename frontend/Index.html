<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDF Analyzer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 400px;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        input[type="file"] {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            width: 100%;
        }

        .buttons {
            margin-top: 20px;
        }

        button {
            margin: 5px;
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            color: white;
            transition: 0.3s;
        }

        .summary {
            background: #4CAF50;
        }

        .sentiment {
            background: #ff9800;
        }

        .topic {
            background: #2196F3;
        }

        button:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        #resultBox {
            margin-top: 20px;
            text-align: left;
        }

        pre {
            background: #f4f6f8;
            padding: 15px;
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
            border-left: 5px solid #4facfe;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>📄 PDF Analyzer App</h2>

    <input type="file" id="fileInput">

    <div class="buttons">
        <button class="summary" onclick="getSummary()">Summary</button>
        <button class="sentiment" onclick="getSentiment()">Sentiment</button>
        <button class="topic" onclick="getTopic()">Topic</button>
    </div>

    <div id="resultBox">
        <h3>Result:</h3>
        <pre id="result">Upload a PDF and click a button...</pre>
    </div>
</div>

<script>
const backendURL = "http://127.0.0.1:8000";

function getFile() {
    const fileInput = document.getElementById("fileInput");
    const formData = new FormData();
    formData.append("file", fileInput.files[0]);
    return formData;
}

function getSummary() {
    fetch(`${backendURL}/summary/`, {
        method: "POST",
        body: getFile()
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("result").innerText = data.summary;
    })
    .catch(() => {
        document.getElementById("result").innerText = "Error!";
    });
}

function getSentiment() {
    fetch(`${backendURL}/sentiment/`, {
        method: "POST",
        body: getFile()
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("result").innerText =
            JSON.stringify(data, null, 2);
    })
    .catch(() => {
        document.getElementById("result").innerText = "Error!";
    });
}

function getTopic() {
    fetch(`${backendURL}/topic/`, {
        method: "POST",
        body: getFile()
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("result").innerText = data.topic;
    })
    .catch(() => {
        document.getElementById("result").innerText = "Error!";
    });
}
</script>

</body>
</html>
