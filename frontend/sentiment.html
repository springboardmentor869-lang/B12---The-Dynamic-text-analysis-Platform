<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis — DocuSense</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <nav class="navbar">
        <a class="navbar-brand" href="/static/home.html">Docu<span>Sense</span></a>
    </nav>

    <div class="container">
        <h2 class="page-title">Sentiment Analysis</h2>

        <div class="main-box">
            <!-- Upload -->
            <div class="box upload-box">

                <h3>Upload Document</h3>

                <label for="fileInput" class="file-drop">
                    <div class="drop-icon">📂</div>
                    <span>Click to browse or drop a file</span>
                    <span style="font-size:0.78rem; color:#9ca3af;">.pdf or .docx</span>
                    <input type="file" id="fileInput" accept=".pdf,.docx">
                </label>
                <div class="file-name-display" id="fileNameDisplay"></div>
                <button onclick="uploadAndAnalyzeSentiment()">Analyse Sentiment</button>
            </div>

            <!-- Output Box -->
            <div class="box output-box">
                <h3>Result</h3>
                <div id="output">
                    <!-- Counts -->
                    <div>
                        <div>
                            <strong>Positive</strong>
                            <p id = "positive_count">0</p>
                        </div>

                        <div>
                            <strong>Negative</strong>
                            <p id = "negative_count">0</p>
                        </div>

                        <div>
                            <strong>Neutral</strong>
                            <p id = "neutral_count">0</p>
                        </div>
                    </div>
                
                    <!-- Overall sentiment -->
                    <div>
                        <strong>Overall Sentiment:</strong>
                        <strong id="overall_sentiment">—</strong>
                    </div>
                </div>
            </div>

        </div>

        <a href="/static/home.html" class="back-link">← Back to Home</a>
    </div>

    <script src="/static/script.js"></script>

</body>
</html>
